<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-évaluation dawo, Groupe Beauvau</title>
<style>
  :root {
    --navy: #231F20;
    --navy-light: #3a3536;
    --grey: #f2f2f2;
    --text: #22262b;
    --accent: #15A452;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #fafafa;
    color: var(--text);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    padding: 24px 20px 60px;
  }
  h1 {
    font-size: 20px;
    color: var(--navy);
    margin: 8px 0 4px;
  }
  .sub {
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 24px;
    margin-bottom: 16px;
  }
  input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  button {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: var(--navy-light); }
  button.secondary {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .progress-wrap {
    height: 6px;
    background: #e6e6e6;
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .progress-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }
  .item-text {
    font-size: 17px;
    line-height: 1.45;
    margin-bottom: 22px;
  }
  .scale {
    display: flex;
    gap: 8px;
  }
  .scale button {
    flex: 1;
    background: white;
    color: var(--navy);
    border: 2px solid var(--navy);
    font-weight: 600;
    padding: 14px 0;
  }
  .scale button:hover { background: var(--navy); color: white; }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
    margin-top: 6px;
    padding: 0 2px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #e0e0e0;
    padding: 8px 6px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--navy);
    color: white;
    font-size: 12px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.strong { background: #d9f0d9; color: #1f6b1f; }
  .badge.medium { background: #fdf0d5; color: #8a6100; }
  .badge.situational { background: #f4dede; color: #a12b2b; }
  .ref {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
  }
  .example {
    font-size: 13px;
    color: #1b1b1b;
    background: #eaf7ef;
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    margin-top: 8px;
    border-radius: 4px;
    line-height: 1.45;
  }
  .comp-block {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 3px solid var(--grey);
  }
  .comp-block:last-child {
    border-bottom: none;
  }
  .comp-title {
    font-size: 16px;
    font-weight: 700;
    color: white;
    background: var(--navy);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .scores {
    display: flex;
    gap: 16px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .scores div span { font-weight: 700; }
  .footer-note {
    font-size: 11px;
    color: #999;
    margin-top: 24px;
    line-height: 1.5;
  }
  .history-item {
    padding: 10px;
    border: 1px solid #eee;
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .history-item:hover { background: var(--grey); }
  .top-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .warn {
    background: #fff8e6;
    border: 1px solid #f0d998;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: #6b5200;
    margin-bottom: 16px;
  }
  @media print {
    .top-actions { display: none !important; }
    body { background: white; }
    .card { box-shadow: none; border: 1px solid #ddd; }
  }
</style>
</head>

<div class="app" id="app"></div>

// Couche de stockage : utilise localStorage (site autonome hors Claude),

// ---------------------------------------------------------------------
const appStorage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) throw new Error("clé introuvable : " + key);
    return { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

// ---------------------------------------------------------------------
// Construction du pool d'items mélangé (compétence + angle cachés au front,
// visibles seulement pour le calcul final)
// ---------------------------------------------------------------------
function buildPool() {
  const pool = [];
  COMPETENCES.forEach(c => {
    c.items.forEach((it, idx) => {
      pool.push({ compKey: c.key, angle: it.angle, text: it.text, id: c.key + "_" + it.angle + "_" + idx });
    });
  });
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool;
}

function buildSynthesis(r) {
  const withData = r.results.filter(c => c.maitrise !== null && c.importance !== null);

  const APPUI_THRESHOLD = 3.5; // moyenne (maîtrise + importance)/2 minimale pour compter comme point d'appui
  const GAP_THRESHOLD = 0.75;  // seuil conventionnel retenu pour cette expérimentation, pas un seuil scientifiquement établi (2 items par dimension)

  const appui = withData
    .filter(c => (c.maitrise + c.importance) / 2 >= APPUI_THRESHOLD)
    .sort((a, b) => (b.maitrise + b.importance) - (a.maitrise + a.importance))
    .slice(0, 3);

  const emerger = withData
    .filter(c => c.action !== null && c.reconnaissance !== null && c.perception !== null)
    .filter(c => ((c.action + c.reconnaissance) / 2 - c.perception) >= GAP_THRESHOLD)
    .sort((a, b) => (((b.action + b.reconnaissance) / 2 - b.perception)) - (((a.action + a.reconnaissance) / 2 - a.perception)))
    .slice(0, 3);

  const vigilance = withData
    .filter(c => (c.importance - c.maitrise) >= GAP_THRESHOLD)
    .sort((a, b) => (b.importance - b.maitrise) - (a.importance - a.maitrise))
    .slice(0, 3);

  function list(items, emptyMsg) {
    if (!items.length) return `<p style="font-size:12px; color:#888; font-style:italic; margin:0 0 12px;">${emptyMsg}</p>`;
    return `<ul style="margin:0 0 12px; padding-left:18px; font-size:13px;">${items.map(c => `<li style="margin-bottom:4px;"><strong>${c.titre}</strong></li>`).join("")}</ul>`;
  }

  return `
    <div style="font-size:14px; font-weight:700; color:var(--navy); margin-bottom:4px;">Ce que ton expérience permet de mettre en lumière</div>
    <p style="font-size:13px; line-height:1.5; color:#444; margin-top:0;">Ton expérience dans le groupe projet fournit des situations concrètes dans lesquelles certains savoirs-agir ont pu être mobilisés. Tes réponses permettent d'identifier ceux que tu reconnais déjà, ceux qui peuvent encore émerger et ceux que tu souhaites développer.</p>
    <p style="font-size:11px; color:#999; font-style:italic; margin:0 0 12px;">Chaque dimension repose sur deux questions distinctes : les écarts ci-dessous restent des repères indicatifs, pas des mesures de précision absolue.</p>
    <div style="margin-top:14px;">
      <div style="font-size:13px; font-weight:700; color:var(--navy);">Tes points d'appui</div>
      <div style="font-size:12px; color:#666; margin-bottom:4px;">Les savoirs-agir pour lesquels ton niveau de maîtrise et l'importance que tu leur accordes sont les plus élevés.</div>
      ${list(appui, "Aucun savoir-agir ne se détache nettement sur ce critère pour cette passation.")}
    </div>
    <div>
      <div style="font-size:13px; font-weight:700; color:var(--navy);">Tes potentiels à faire émerger</div>
      <div style="font-size:12px; color:#666; margin-bottom:4px;">Des capacités présentes dans ton expérience, mais que tu n'identifies pas encore nécessairement comme des compétences.</div>
      ${list(emerger, "Aucun écart marqué entre l'action/la reconnaissance et ta propre perception n'est ressorti.")}
    </div>
    <div>
      <div style="font-size:13px; font-weight:700; color:var(--navy);">Tes zones de développement</div>
      <div style="font-size:12px; color:#666; margin-bottom:4px;">Des savoirs-agir que tu considères importants et pour lesquels ton niveau de maîtrise déclaré est encore plus modéré.</div>
      ${list(vigilance, "Aucun écart marqué entre l'importance accordée et le niveau de maîtrise déclaré n'est ressorti.")}
    </div>
    <p style="font-size:12px; color:#777; margin-top:14px; margin-bottom:0; font-style:italic;">L'objectif n'est pas de produire une note ou un classement. L'objectif est de transformer une expérience vécue en compétences identifiables, explicables et valorisables.</p>
  `;
}

function buildDimensionTable(c) {

function buildDimensionReading(c) {
  const GAP_THRESHOLD = 0.75;
  if (c.action === null || c.perception === null || c.reconnaissance === null) return "";
  const collectif = (c.action + c.reconnaissance) / 2;
  const gap = collectif - c.perception;
  if (Math.abs(gap) < GAP_THRESHOLD) return "";
  if (gap >= GAP_THRESHOLD) {
    return `<p style="font-size:12px; color:#555; font-style:italic; margin:4px 0 0;">Ton expérience montre une mobilisation marquée de ce savoir-agir, et le collectif semble également l'avoir reconnu. Tu l'identifies pourtant moins spontanément comme une capacité qui te caractérise : ce décalage mérite d'être exploré, pas nécessairement corrigé.</p>`;
  }
  return `<p style="font-size:12px; color:#555; font-style:italic; margin:4px 0 0;">Tu te perçois toi-même plus fort sur ce savoir-agir que ce que l'action et la reconnaissance du collectif ne le montrent dans cette expérience précise. Ça peut venir d'une confiance déjà installée, ou d'un savoir-agir peu sollicité par ce projet en particulier.</p>`;
}

function scoreLabel(gap, maitrise) {
  const LOW_THRESHOLD = 2.5;
  if (gap <= 0.7 && maitrise !== null && maitrise !== undefined && maitrise < LOW_THRESHOLD) {
    return {
      text: "Peu mobilisé dans cette expérience",
      cls: "situational",
      explain: "Ce savoir-agir n'a pas été particulièrement mobilisé dans ce projet précis. Ça ne dit rien de ta capacité générale, seulement de cette expérience-là.",
    };
  }
  if (gap <= 0.7) return {
    text: "Compétence identifiée",
    cls: "strong",
    explain: "Maîtrise et importance sont alignées. Le savoir-agir est clairement identifié dans l'expérience vécue.",
  };
  if (gap <= 1.5) return {
    text: "Compétence à faire émerger",
    cls: "medium",
    explain: "Le savoir-agir apparaît dans l'expérience mais mérite d'être davantage conscientisé ou explicité.",

  return {
    text: "Savoir-agir contextualisé",
    cls: "situational",
    explain: "Le savoir-agir apparaît dans les situations vécues du projet, mais il est trop tôt pour conclure à sa transférabilité dans d'autres contextes.",
  };
}

function computeResults(pool, answers) {
  const byComp = {};
  COMPETENCES.forEach(c => { byComp[c.key] = { key: c.key, titre: c.titre, definition: c.definition, illustration: c.illustration, refStrategie: c.refStrategie, refRNE: c.refRNE, exempleOral: c.exempleOral, actionVals: [], perceptionVals: [], autresVals: [], importanceVals: [] }; });
  pool.forEach(item => {
    const v = answers[item.id];
    if (v === undefined) return;
    const comp = byComp[item.compKey];
    if (item.angle === "importance") comp.importanceVals.push(v);
    else if (item.angle === "action") comp.actionVals.push(v);
    else if (item.angle === "perception") comp.perceptionVals.push(v);
    else if (item.angle === "autres") comp.autresVals.push(v);
  });
  function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null; }
  return Object.values(byComp).map(c => {
    const action = avg(c.actionVals);
    const perception = avg(c.perceptionVals);
    const reconnaissance = avg(c.autresVals);
    const importance = avg(c.importanceVals);
    // maîtrise = moyenne des 3 dimensions déclaratives, chacune pesant pour un tiers
    // quel que soit le nombre de questions qui la composent (pas une moyenne des items bruts).
    const dims = [action, perception, reconnaissance].filter(v => v !== null);
    const maitrise = dims.length ? dims.reduce((a, b) => a + b, 0) / dims.length : null;
    const gap = (maitrise !== null && importance !== null) ? Math.abs(maitrise - importance) : null;
    return { ...c, action, perception, reconnaissance, importance, maitrise, gap };
  });
}

    state.consent = document.getElementById("consent-checkbox").checked;
    let resumed = false;
    if (state.consent) {
      try {
        const saved = await appStorage.get("progression:" + normalizePrenom(val));
        if (saved && saved.value) {
          const data = JSON.parse(saved.value);
          if (data.currentIndex < data.pool.length) {
            const wantsResume = confirm(`Une passation en cours a été trouvée pour ${val}, à la question ${data.currentIndex + 1} sur ${data.pool.length}. Veux-tu la reprendre ? (Annuler pour recommencer à zéro)`);
            if (wantsResume) {
              state.pool = data.pool;
              state.currentIndex = data.currentIndex;
              state.answers = data.answers;
              resumed = true;
            }
          }
        }
      } catch (e) { /* pas de progression sauvegardée, on repart normalement */ }
    }
    if (!resumed) {
      state.pool = buildPool();
      state.currentIndex = 0;
      state.answers = {};
    }
    state.screen = "quiz";
    render();
  };
}

const SCALE_LABELS = {
  action: { min: "Pas du tout vrai de mon expérience", max: "Tout à fait vrai de mon expérience" },
  perception: { min: "Pas du tout vrai de mon expérience", max: "Tout à fait vrai de mon expérience" },
  autres: { min: "Pas du tout vrai de mon expérience", max: "Tout à fait vrai de mon expérience" },
  importance: { min: "Pas du tout important", max: "Essentiel" },
};

function renderQuiz() {
  const item = state.pool[state.currentIndex];
  const pct = Math.round((state.currentIndex / state.pool.length) * 100);
  const half = Math.floor(state.pool.length / 2);
  const halfNote = state.currentIndex === half ? `<div class="warn" style="margin-top:0;">Tu es à la moitié. Tu peux t'arrêter et reprendre plus tard si besoin : ta progression est sauvegardée automatiquement.</div>` : "";
  const labels = SCALE_LABELS[item.angle] || SCALE_LABELS.action;
  app.innerHTML = `
    <h1>Auto-évaluation dawo</h1>
    <div class="progress-label">${state.currentIndex + 1} / ${state.pool.length}</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    ${halfNote}
    <div class="card">
      <div class="item-text">${item.text}</div>
      <div class="scale">
        ${[1,2,3,4,5].map(n => `<button data-n="${n}">${n}</button>`).join("")}
      </div>
      <div class="scale-labels"><span>${labels.min}</span><span>${labels.max}</span></div>
    </div>
  `;
  document.querySelectorAll(".scale button").forEach(btn => {
    btn.onclick = async () => {
      state.answers[item.id] = parseInt(btn.dataset.n, 10);
      if (state.consent) {
        try {
          await appStorage.set("progression:" + normalizePrenom(state.prenom), JSON.stringify({
            pool: state.pool, currentIndex: state.currentIndex + 1, answers: state.answers,
          }), false);
        } catch (e) { /* pas grave si la sauvegarde intermédiaire échoue */ }
      }
      if (state.currentIndex < state.pool.length - 1) {
        state.currentIndex++;
        render();
      } else {
        finishQuiz();
      }
    };
  });
}

const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyAHfPpYp5IonimFyN7Ubw9wPk3UVYIaMAXCRvmKGQ9Heqn6-KvUiTi9GhGyRjfFuIaVw/exec";
// Ce "secret" est un simple filtre technique contre les envois accidentels ou aléatoires
// vers la feuille (il est visible en clair dans ce fichier). Ce n'est pas une vraie sécurité :
// n'importe qui inspectant le code source de la page peut le lire. Suffisant pour cette
// expérimentation à effectif restreint, pas pour protéger des données sensibles à grande échelle.
const SHEET_SHARED_SECRET = "beauvau-dawo-2025";

async function sendToSheet(r) {
  if (SHEET_WEBAPP_URL === "URL_A_DEFINIR") return { ok: false, skipped: true };
  const byKey = {};
  r.results.forEach(c => { byKey[c.key] = c; });
  const submissionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (r.prenom + "_" + Date.now() + "_" + Math.random().toString(36).slice(2));
  const payload = {
    secret: SHEET_SHARED_SECRET,
    submissionId: submissionId,
    prenom: r.prenom,
    date: new Date(r.date).toLocaleDateString("fr-FR"),
  };
  ["convaincre", "coordonner", "organiser", "responsabilites", "complexite", "ecrire", "integration", "creativite", "stress", "controle"].forEach(k => {
    payload[k] = byKey[k] && byKey[k].maitrise !== null ? Number(byKey[k].maitrise.toFixed(1)) : "";
  });
  try {
    await fetch(SHEET_WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    return { ok: true };
  } catch (e) {
    console.error("Erreur d'enregistrement dans le tableau", e);
    return { ok: false };
  }
}

let finishQuizInProgress = false;

async function finishQuiz() {
  if (finishQuizInProgress) return;
  finishQuizInProgress = true;
  const results = computeResults(state.pool, state.answers);
  const record = { prenom: state.prenom, date: new Date().toISOString(), results, stored: state.consent };
  if (state.consent) {
    try {
      await appStorage.set("resultat:" + state.prenom + "_" + Date.now(), JSON.stringify(record));
    } catch (e) { console.error("Erreur de sauvegarde", e); }
    try {
      await appStorage.delete("progression:" + normalizePrenom(state.prenom));
    } catch (e) { /* rien à nettoyer */ }
    record.sheetResult = await sendToSheet(record);
  }
  state.lastResult = record;
  state.screen = "result";
  render();
}

const TABLE_ORDER = ["convaincre", "coordonner", "organiser", "responsabilites", "complexite", "ecrire", "integration", "creativite", "stress", "controle"];
const TABLE_LABELS = {
  convaincre: "Convaincre",
  coordonner: "Coordonner",
  organiser: "Organiser",
  responsabilites: "Responsabilités",
  complexite: "Complexité",
  ecrire: "Écrire",
  integration: "Travail en équipe",
  creativite: "Empathie",
  stress: "Gestion du stress",
  controle: "Maîtrise de soi",
};

function scoreFR(v) {
  return v !== null && v !== undefined ? v.toFixed(1).replace(".", ",") : "";
}

function buildTableRow(r, sep) {
  const byKey = {};
  r.results.forEach(c => { byKey[c.key] = c; });
  const dateStr = new Date(r.date).toLocaleDateString("fr-FR");
  const header = ["Participant", "Date", ...TABLE_ORDER.map(k => TABLE_LABELS[k])].join(sep);
  const row = [r.prenom, dateStr, ...TABLE_ORDER.map(k => scoreFR(byKey[k] ? byKey[k].maitrise : null))].join(sep);
  return { header, row };
}

function downloadCSVRow(r) {
  const { header, row } = buildTableRow(r, ";");
  const csv = header + "\n" + row;
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ligne_dawo_${r.prenom.replace(/\s+/g, "_")}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const subject = encodeURIComponent(`Rapport dawo, ${r.prenom}, projet J'IMPACT ma Sécurité Civile`);
  const body = encodeURIComponent(buildReportText(r));
  window.location.href = `mailto:${ORGANIZER_EMAIL}?subject=${subject}&body=${body}`;
}

function buildRadarSVG(r) {
  const byKey = {};
  r.results.forEach(c => { byKey[c.key] = c; });
  const order = TABLE_ORDER;
  const n = order.length;
  const size = 340;
  const center = size / 2;
  const maxR = 120;
  const levels = [1, 2, 3, 4, 5];

  function pointFor(index, value) {
    const angle = (Math.PI * 2 * index) / n - Math.PI / 2;
    const r2 = (value / 5) * maxR;
    return [center + r2 * Math.cos(angle), center + r2 * Math.sin(angle)];
  }

  let grid = "";
  levels.forEach(lvl => {
    const pts = order.map((k, i) => pointFor(i, lvl).join(",")).join(" ");
    grid += `<polygon points="${pts}" fill="none" stroke="#e2e2e2" stroke-width="1"/>`;
  });

  let axes = "";
  let labels = "";
  order.forEach((k, i) => {
    const [x, y] = pointFor(i, 5);
    axes += `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" stroke="#e2e2e2" stroke-width="1"/>`;
    const [lx, ly] = pointFor(i, 5.75);
    labels += `<circle cx="${lx}" cy="${ly}" r="10" fill="#231F20"/><text x="${lx}" y="${ly}" font-size="11" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="middle">${i + 1}</text>`;
  });

  const dataPts = order.map((k, i) => {
    const v = byKey[k] && byKey[k].maitrise !== null ? byKey[k].maitrise : 0;
    return pointFor(i, v).join(",");
  }).join(" ");

  return `
    <svg viewBox="0 0 ${size} ${size + 20}" width="100%" style="max-width:380px; display:block; margin:0 auto;">
      ${grid}
      ${axes}
      <polygon points="${dataPts}" fill="#15A452" fill-opacity="0.28" stroke="#15A452" stroke-width="2"/>
      ${labels}
    </svg>
  `;
}

function buildRadarLegend() {
  const items = TABLE_ORDER.map((k, i) => {
    const c = COMPETENCES.find(x => x.key === k);
    return `<div style="font-size:12px; margin-bottom:3px;"><strong>${i + 1}.</strong> ${c ? c.titre : k}</div>`;
  }).join("");
  return `<div style="max-width:340px; margin:8px auto 0;">${items}</div>`;
}

function renderResult() {

  const sheetNote = !state.consent

  app.innerHTML = `
    <h1>Résultats : ${r.prenom}</h1>

    <div class="card" style="margin-bottom:12px;">
      <p style="font-size:13px; line-height:1.55; margin:0;">

      </p>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px; font-weight:700; color:var(--navy); margin-bottom:8px;">Comment le lien a été construit</div>
      <p style="font-size:13px; line-height:1.55; margin:0 0 8px;">Pour chaque situation de travail mesurée par l'enquête Conditions de travail de la DARES (encadrement, travail en équipe, contact avec le public, charge émotionnelle...), un tableau croisé indique quels savoirs-agir du référentiel dawo cette situation mobilise. Une situation peut en mobiliser plusieurs à la fois : encadrer une équipe, par exemple, sollicite en même temps la coordination, l'organisation et la capacité à convaincre.</p>
      <p style="font-size:13px; line-height:1.55; margin:0 0 8px;">La DARES fournit ensuite, pour chaque situation, un score moyen propre à la famille professionnelle P4Z (armée, police, pompiers), comparé à la moyenne toutes familles confondues. Un écart positif signifie que cette situation revient plus souvent dans ce métier que dans l'ensemble des métiers étudiés par l'enquête.</p>
      <p style="font-size:13px; line-height:1.55; margin:0;">En croisant les deux, chaque savoir-agir répond à une question précise : apparaît-il dans une situation que ce métier rencontre plus souvent que la moyenne ? C'est le cas pour 9 des 10 retenus ici. Un seul (appréhender la complexité) tient sur un écart réel mais faible : on te le dit plutôt que de le maquiller en argument fort.</p>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px; font-weight:700; color:var(--navy); margin-bottom:8px;">Comment dawo construit ton profil</div>
      <p style="font-size:13px; line-height:1.55; margin:0 0 8px;">Pour chacun des 10 savoirs-agir, dawo croise quatre dimensions :</p>
      <p style="font-size:13px; line-height:1.5; margin:0 0 6px;"><strong>Dans l'action</strong> : ce que ton expérience du projet permet d'identifier à travers les situations et comportements que tu as vécus.</p>
      <p style="font-size:13px; line-height:1.5; margin:0 0 6px;"><strong>La perception</strong> : la manière dont tu penses être perçu par les autres dans ce savoir-agir.</p>
      <p style="font-size:13px; line-height:1.5; margin:0 0 6px;"><strong>Le regard des autres</strong> : les situations dans lesquelles d'autres participants t'ont sollicité, identifié ou reconnu pour ce savoir-agir.</p>
      <p style="font-size:13px; line-height:1.5; margin:0 0 8px;"><strong>L'importance</strong> : la place que tu accordes toi-même à ce savoir-agir dans la réussite du projet.</p>
      <p style="font-size:13px; line-height:1.55; margin:0;">La maîtrise affichée sur ton profil est la moyenne de trois de ces quatre dimensions : ce que tu as fait, comment tu penses être perçu, ce que le collectif semble avoir reconnu. Ce n'est donc pas une maîtrise au sens psychométrique ou professionnel : c'est un indice de mobilisation perçue et reconnue dans cette expérience précise, pas un jugement général sur qui tu es.</p>
    </div>
    <div style="background:var(--navy); color:white; padding:14px 18px; border-radius:8px; margin-bottom:12px;">
      <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:4px;">Partie 1</div>
      <div style="font-size:16px; font-weight:700;">Ton auto-évaluation dawo</div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px; font-weight:700; color:var(--navy); margin-bottom:6px; text-align:center;">Ton profil de maîtrise</div>
      ${buildRadarSVG(r)}
      ${buildRadarLegend()}
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px; font-weight:700; color:var(--navy); margin-bottom:8px;">Comment lire les statuts ci-dessous</div>
      ${buildStatusLegend()}
    </div>
    <div class="card" style="margin-bottom:12px;">
      ${buildSynthesis(r)}
    </div>
    <div class="card" id="results-card"></div>
    ${buildRegardAnimateurs()}
    <div class="top-actions">
      <button id="download-btn">Télécharger le rapport</button>
      <button class="secondary" id="print-btn">Imprimer</button>
    </div>
    <details style="margin-bottom:16px;">
      <summary style="cursor:pointer; font-size:13px; color:#555;">En cas de problème avec l'enregistrement automatique</summary>
      <div class="top-actions" style="margin-top:10px;">
        <button class="secondary" id="csv-btn">Télécharger ma ligne (tableau)</button>
        <button class="secondary" id="email-btn">Envoyer mon rapport par mail</button>
      </div>
    </details>
    <div class="top-actions">
      <button class="secondary" id="restart-btn">Nouvelle passation</button>
      <button class="secondary" id="home-btn">Accueil</button>
    </div>
    <div class="footer-note">
      Le détail de tes réponses et ce rapport complet restent sur ton appareil. Si tu as donné ton accord, seul un résumé de tes scores par savoir-agir a été transmis à l'organisatrice. L'envoi de ce rapport par mail est volontaire : rien n'est transmis sans que tu cliques sur le bouton.<br/>
      Sources : dawo, référentiel dawoGrid (39 savoirs-agir). France Stratégie, « Situations de travail, compétences transversales et mobilité entre les métiers » et son annexe méthodologique (2021), d'après l'enquête Conditions de travail de la DARES, famille P4Z.
      Référentiels Nationaux d'Évaluation des emplois tenus par les lieutenants de 1re classe et par les capitaines SPP, DGSCGC/DSP/SDDRH/BDFE, version du 30/04/2020 (texte des compétences transversales identique dans les deux documents).
    </div>
  `;
  const card = document.getElementById("results-card");
  r.results
    .slice()
    .sort((a, b) => (b.maitrise || 0) - (a.maitrise || 0))
    .forEach(c => {
      const gapInfo = c.gap !== null ? scoreLabel(c.gap, c.maitrise) : { text: "incomplet", cls: "medium", explain: "Réponses insuffisantes pour conclure." };
      const block = document.createElement("div");
      block.className = "comp-block";
      block.innerHTML = `
        <div class="comp-title">${c.titre}</div>
        <div class="ref" style="font-style:italic;">${c.definition}</div>
        <div class="ref" style="font-style:italic;">On dit de moi que : « ${c.illustration} »</div>
        <div style="font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em; margin-top:10px;">Ton expérience</div>
        ${buildDimensionTable(c)}
        ${buildDimensionReading(c)}
        <div><span class="badge ${gapInfo.cls}">${gapInfo.text}</span></div>
        <div class="ref" style="margin-top:6px;">${gapInfo.explain}</div>
        <div class="example"><strong>Une situation de ton expérience à valoriser à l'oral :</strong> ${c.exempleOral}<br/><span style="font-style:italic; font-size:12px;">À personnaliser avant l'oral : précise le moment, les personnes concernées et la décision ou l'action que tu as réellement prise.</span></div>
        <div style="font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-top:10px;">Repère professionnel</div>
        <div class="ref">${c.refStrategie}</div>
        <div style="font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-top:6px;">Attendu du métier</div>
        <div class="ref">${c.refRNE}</div>
      `;
      card.appendChild(block);
    });
  document.getElementById("restart-btn").onclick = () => { state.screen = "start"; render(); };
  document.getElementById("home-btn").onclick = () => { state.screen = "start"; render(); };
  document.getElementById("download-btn").onclick = () => downloadReport(r);
  document.getElementById("print-btn").onclick = () => window.print();
  document.getElementById("csv-btn").onclick = () => downloadCSVRow(r);
  document.getElementById("email-btn").onclick = () => emailReport(r);
}

render();
</script>
